name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.svg"
      - "icon-512.svg"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "ANDROID_BUILD.md"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon-192.svg"
      - "icon-512.svg"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and prepare existing web app
        run: |
          node --check scripts/prepare-www.mjs
          npm run android:prepare
          test -s www/index.html
          test -s www/manifest.webmanifest
          test -s www/sw.js

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync packaged web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
